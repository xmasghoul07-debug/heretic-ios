<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Heretic AI">
    <meta name="theme-color" content="#0d1117">
    <title>Heretic AI</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --accent-color: #ff5722;
            --text-color: #c9d1d9;
            --terminal-bg: #161b22;
            --border-color: #30363d;
            --success: #238636;
            --info: #58a6ff;
            --error: #da3633;
        }

        * {
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100vh;
            height: 100dvh;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Menlo", "Monaco", "Courier New", monospace;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: fixed;
        }

        header {
            background-color: var(--terminal-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            z-index: 100;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--error);
            animation: pulse 2s infinite;
        }

        .status-dot.online {
            background-color: var(--success);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        #terminal {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 12px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 12px;
            line-height: 1.4;
            -webkit-overflow-scrolling: touch;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .log-entry {
            border-left: 2px solid var(--border-color);
            padding-left: 8px;
            animation: slideIn 0.2s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .log-entry.user {
            border-left-color: var(--accent-color);
            color: var(--accent-color);
        }

        .log-entry.system {
            border-left-color: var(--info);
            color: var(--text-color);
        }

        .log-entry.error {
            border-left-color: var(--error);
            color: var(--error);
        }

        .log-entry.success {
            border-left-color: var(--success);
            color: var(--success);
        }

        .controls {
            background-color: var(--terminal-bg);
            border-top: 1px solid var(--border-color);
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        input[type="text"], textarea {
            flex: 1;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            -webkit-user-select: text;
            user-select: text;
        }

        textarea {
            min-height: 40px;
            max-height: 80px;
            resize: none;
        }

        input::placeholder {
            color: #6e7681;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.15s;
            -webkit-tap-highlight-color: transparent;
        }

        button:active {
            transform: scale(0.95);
            opacity: 0.8;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button.secondary {
            background-color: #21262d;
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }

        .hidden-panel {
            display: none !important;
        }

        .config-info {
            font-size: 10px;
            color: #6e7681;
            padding: 4px 8px;
            background-color: rgba(255, 255, 255, 0.02);
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        @media (max-height: 600px) {
            #terminal {
                font-size: 11px;
            }

            input[type="text"], textarea {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <header>
        <span>⚡ HERETIC AI</span>
        <div class="status-indicator">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">INIT</span>
        </div>
    </header>

    <div id="terminal">
        <div class="log-entry system">$ Heretic AI initializing...</div>
        <div class="log-entry system">$ Detecting environment and backend...</div>
    </div>

    <div class="controls">
        <div class="input-row">
            <textarea id="userInput" placeholder="Ask Heretic..." onkeypress="handleKeyPress(event)"></textarea>
            <button id="sendBtn" onclick="sendMessage()" style="width: 50px; padding: 10px;">SEND</button>
        </div>
        <div class="config-info" id="configInfo">Configuring...</div>
    </div>

    <script>
        // Auto-configuration and environment detection
        class HereticAI {
            constructor() {
                this.backendUrl = this.detectBackendUrl();
                this.terminal = document.getElementById('terminal');
                this.userInput = document.getElementById('userInput');
                this.sendBtn = document.getElementById('sendBtn');
                this.statusDot = document.getElementById('statusDot');
                this.statusText = document.getElementById('statusText');
                this.configInfo = document.getElementById('configInfo');
                this.isOnline = false;
                this.init();
            }

            detectBackendUrl() {
                // Auto-detect backend based on environment
                const hostname = window.location.hostname;
                const protocol = window.location.protocol;
                const port = window.location.port;

                // If on localhost, use localhost backend
                if (hostname === 'localhost' || hostname === '127.0.0.1') {
                    return 'http://localhost:8000';
                }

                // If on a real domain, try to use backend on same domain with /api prefix
                // This assumes your Netlify or production setup routes /api to the backend
                if (protocol === 'https:') {
                    // Try standard API endpoint first
                    return `https://${hostname}/api`;
                }

                // Fallback to localStorage or default
                const stored = localStorage.getItem('backendUrl');
                if (stored) return stored;

                // Default for Render/Railway deployments
                return 'https://heretic-ai-backend.onrender.com';
            }

            async init() {
                this.log('$ Detected backend: ' + this.backendUrl, 'system');
                this.log('$ Testing connection...', 'system');
                await this.checkConnection();
                this.setupEventListeners();
            }

            async checkConnection() {
                try {
                    const response = await fetch(`${this.backendUrl}/`, {
                        method: 'GET',
                        mode: 'cors',
                        timeout: 5000
                    });

                    if (response.ok) {
                        const data = await response.json();
                        this.isOnline = true;
                        this.updateStatus(true);
                        this.log(`$ Connected to ${data.engine || 'Backend'}`, 'success');
                        this.log('$ Ready for input.', 'system');
                        this.configInfo.textContent = `✔ Backend: ${this.backendUrl}`;
                    } else {
                        throw new Error(`Status ${response.status}`);
                    }
                } catch (err) {
                    this.isOnline = false;
                    this.updateStatus(false);
                    this.log(`$ Connection failed: ${err.message}`, 'error');
                    this.log('$ Running in demo mode.', 'system');
                    this.configInfo.textContent = '! Demo mode (no backend)';
                }
            }

            setupEventListeners() {
                this.userInput.addEventListener('input', () => {
                    this.userInput.style.height = 'auto';
                    this.userInput.style.height = Math.min(this.userInput.scrollHeight, 80) + 'px';
                });
            }

            async sendMessage() {
                const message = this.userInput.value.trim();
                if (!message) return;

                this.log(`> ${message}`, 'user');
                this.userInput.value = '';
                this.userInput.style.height = 'auto';
                this.sendBtn.disabled = true;

                if (this.isOnline) {
                    await this.sendToBackend(message);
                } else {
                    this.sendDemoResponse(message);
                }

                this.sendBtn.disabled = false;
            }

            async sendToBackend(message) {
                try {
                    this.log('$ Processing...', 'system');
                    const response = await fetch(`${this.backendUrl}/api/chat`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ message })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        this.log(data.response || 'No response', 'system');
                    } else {
                        throw new Error(`Status ${response.status}`);
                    }
                } catch (err) {
                    this.log(`$ Error: ${err.message}`, 'error');
                }
            }

            sendDemoResponse(message) {
                const lower = message.toLowerCase();
                let response = '';

                if (lower.includes('hello') || lower.includes('hi')) {
                    response = '$ Hello! I\'m Heretic AI running in demo mode. Connect a backend to enable live responses.';
                } else if (lower.includes('what') || lower.includes('who')) {
                    response = '$ I\'m Heretic AI, an uncensored language model assistant. This is the demo version.';
                } else if (lower.includes('how')) {
                    response = '$ To use live AI: 1) Deploy backend 2) Update backend URL 3) Reconnect';
                } else if (lower.includes('help')) {
                    response = '$ Commands: chat freely, or deploy a backend for live LLM responses.';
                } else {
                    response = `$ [DEMO] Received: "${message}" - Connect backend for real responses.`;
                }

                this.log(response, 'system');
            }

            log(text, type = 'system') {
                const entry = document.createElement('div');
                entry.className = `log-entry ${type}`;
                entry.textContent = text;
                this.terminal.appendChild(entry);
                this.terminal.scrollTop = this.terminal.scrollHeight;
            }

            updateStatus(online) {
                this.statusDot.className = `status-dot ${online ? 'online' : ''}`;
                this.statusText.textContent = online ? 'ONLINE' : 'OFFLINE';
            }
        }

        // Initialize on load
        let app;
        window.addEventListener('load', () => {
            app = new HereticAI();
        });

        // Global functions for HTML
        function handleKeyPress(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (app) app.sendMessage();
            }
        }

        function sendMessage() {
            if (app) app.sendMessage();
        }
    </script>
</body>
</html>
